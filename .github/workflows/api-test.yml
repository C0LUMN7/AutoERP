name: ERP API Automation Test

on:
  workflow_dispatch:
    inputs:
      suite:
        description: '选择要执行的测试套件'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - single
          - business
          - exception
          - all
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read

env:
  CI: true
  GITHUB_ACTIONS: true
  JENKINS_CI: true

jobs:
  code-check:
    if: github.event_name == 'push'
    name: Code syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile run.py
          python -m py_compile api/conftest.py
          python -m py_compile api/framework/runner.py
          python -m py_compile api/framework/http_client.py
          python -m py_compile api/framework/legacy_yaml_store.py
          python -m py_compile api/framework/assertions.py
          python -m py_compile shared/database.py
          python -m py_compile shared/debugtalk.py
          python -m py_compile shared/logger.py
          python -m py_compile shared/notification.py

      - name: Test collection check
        run: |
          pytest api --collect-only --no-header -q
          pytest ui --collect-only --no-header -q

  api-test:
    if: github.event_name == 'workflow_dispatch'
    name: Run ${{ github.event.inputs.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: erp-api-test-${{ github.event.inputs.suite }}-${{ github.actor }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          set -e
          ALLURE_VERSION=2.33.0
          curl -fL --retry 3 -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -zxf allure.tgz
          sudo mv "allure-${ALLURE_VERSION}" /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH
          /opt/allure/bin/allure --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ERP API connectivity
        env:
          ERP_API_URL: ${{ secrets.ERP_API_URL || secrets.ERP_HOST }}
        run: |
          python - <<'PY'
          import os, requests
          host = os.environ.get("ERP_API_URL", "")
          if not host:
              raise SystemExit("ERP_API_URL is empty — check GitHub Secrets")
          try:
              r = requests.get(host, timeout=10, verify=False)
              print(f"ERP API reachable, status: {r.status_code}")
          except Exception as e:
              raise SystemExit(f"ERP API unreachable: {e}")
          PY

      - name: Generate local config
        run: |
          cat > config/local.ini <<EOF
          [api_envi]
          host = ${{ secrets.ERP_API_URL || secrets.ERP_HOST }}
          ui_host = ${{ secrets.ERP_UI_URL }}

          [LOGIN]
          username = ${{ secrets.ERP_USERNAME }}
          password = ${{ secrets.ERP_PASSWORD }}

          [MYSQL]
          host = ${{ secrets.MYSQL_HOST }}
          port = ${{ secrets.MYSQL_PORT }}
          username = ${{ secrets.MYSQL_USERNAME }}
          password = ${{ secrets.MYSQL_PASSWORD }}
          database = ${{ secrets.MYSQL_DATABASE }}

          [DINGTALK]
          webhook = ${{ secrets.DINGTALK_WEBHOOK }}
          secret = ${{ secrets.DINGTALK_SECRET }}

          [EMAIL]
          host = ${{ secrets.EMAIL_HOST }}
          port = ${{ secrets.EMAIL_PORT }}
          user = ${{ secrets.EMAIL_USER }}
          passwd = ${{ secrets.EMAIL_PASSWD }}
          addressee = ${{ secrets.EMAIL_ADDRESSEE }}
          subject = ERP接口自动化测试报告

          [REPORT_TYPE]
          type = allure
          EOF

      - name: Run tests
        run: python run.py api --suite ${{ github.event.inputs.suite }}

      - name: Build test summary
        if: always()
        env:
          TEST_SUITE: ${{ github.event.inputs.suite }}
          EXECUTION_STATUS: ${{ job.status }}
          JUNIT_XML: reports/api_results.xml
          SUMMARY_FILE: artifact-summary/api-test.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["JUNIT_XML"])
          summary = {
              "suite": os.environ["TEST_SUITE"],
              "execution_status": os.environ["EXECUTION_STATUS"],
              "junit_summary_available": report.is_file(),
              "total": None,
              "passed": None,
              "failed": None,
              "skipped": None,
          }
          if report.is_file():
              root = ET.parse(report).getroot()
              suites = [root] if root.tag.rsplit("}", 1)[-1] == "testsuite" else [
                  child for child in root if child.tag.rsplit("}", 1)[-1] == "testsuite"
              ]
              total = sum(int(suite.get("tests", 0)) for suite in suites)
              failed = sum(int(suite.get("failures", 0)) + int(suite.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
              summary.update(total=total, passed=max(total - failed - skipped, 0), failed=failed, skipped=skipped)
          output = Path(os.environ["SUMMARY_FILE"])
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-api-test-summary-${{ github.event.inputs.suite }}-${{ github.run_id }}
          path: artifact-summary/api-test.json
          retention-days: 30
          if-no-files-found: error
