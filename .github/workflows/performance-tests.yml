name: ERP Performance Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target ERP test environment'
        required: true
        default: 'cloud_test'
        type: choice
        options:
          - cloud_test
      scenario:
        description: 'Performance scenario'
        required: true
        default: 'readonly'
        type: choice
        options:
          - readonly
      users:
        description: 'Concurrent users, max 10'
        required: true
        default: '1'
      spawn_rate:
        description: 'User spawn rate per second'
        required: true
        default: '1'
      run_time:
        description: 'Duration, max 5m'
        required: true
        default: '1m'

permissions:
  contents: read

concurrency:
  group: jsh-erp-performance
  cancel-in-progress: false

env:
  CI: true
  GITHUB_ACTIONS: true
  JENKINS_CI: true
  ERP_ENV: ${{ inputs.environment }}
  ERP_API_URL: ${{ secrets.ERP_API_URL }}
  ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
  ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

jobs:
  readonly-performance:
    name: Read-only performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERF_SCENARIO: ${{ inputs.scenario }}
      PERF_USERS: ${{ inputs.users }}
      PERF_SPAWN_RATE: ${{ inputs.spawn_rate }}
      PERF_RUN_TIME: ${{ inputs.run_time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate performance inputs
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          scenario = os.environ["PERF_SCENARIO"]
          users = os.environ["PERF_USERS"]
          spawn_rate = os.environ["PERF_SPAWN_RATE"]
          run_time = os.environ["PERF_RUN_TIME"]

          if scenario != "readonly":
              raise SystemExit("scenario must be readonly")

          if not re.fullmatch(r"[1-9]\d*", users):
              raise SystemExit("users must be a positive integer")
          if int(users) > 10:
              raise SystemExit("users must not exceed 10")

          try:
              parsed_spawn_rate = float(spawn_rate)
          except ValueError:
              raise SystemExit("spawn_rate must be a positive number") from None
          if parsed_spawn_rate <= 0:
              raise SystemExit("spawn_rate must be a positive number")

          if not re.fullmatch(r"[1-9]\d*[smh]", run_time):
              raise SystemExit("run_time must use a format like 30s, 1m or 5m")
          seconds = int(run_time[:-1]) * {"s": 1, "m": 60, "h": 3600}[run_time[-1]]
          if seconds > 300:
              raise SystemExit("run_time must not exceed 5m")

          for name in ("ERP_API_URL", "ERP_USERNAME", "ERP_PASSWORD"):
              if not os.environ.get(name):
                  raise SystemExit(f"{name} is empty")

          print("performance inputs validated")
          PY

      - name: Run read-only performance precheck
        run: python run.py performance --scenario readonly --users 1 --spawn-rate 1 --run-time 1m

      - name: Run read-only performance test
        run: python run.py performance --scenario "$PERF_SCENARIO" --users "$PERF_USERS" --spawn-rate "$PERF_SPAWN_RATE" --run-time "$PERF_RUN_TIME"

      - name: Build performance summary
        if: always()
        env:
          EXECUTION_STATUS: ${{ job.status }}
          SUMMARY_FILE: artifact-summary/performance.json
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          summary = {
              "suite": "readonly-performance",
              "execution_status": os.environ["EXECUTION_STATUS"],
              "scenario": os.environ["PERF_SCENARIO"],
              "users": os.environ["PERF_USERS"],
              "spawn_rate": os.environ["PERF_SPAWN_RATE"],
              "run_time": os.environ["PERF_RUN_TIME"],
              "aggregate_summary_available": False,
              "request_count": None,
              "failure_count": None,
          }
          reports = list(Path("reports/locust").glob("*_stats.csv"))
          if reports:
              latest = max(reports, key=lambda path: path.stat().st_mtime)
              with latest.open(newline="", encoding="utf-8-sig") as stream:
                  for row in csv.DictReader(stream):
                      if row.get("Name") == "Aggregated":
                          summary.update(
                              aggregate_summary_available=True,
                              request_count=int(row["Request Count"]),
                              failure_count=int(row["Failure Count"]),
                          )
                          break
          output = Path(os.environ["SUMMARY_FILE"])
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload performance summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readonly-performance-summary-${{ github.run_id }}
          path: artifact-summary/performance.json
          retention-days: 14
          if-no-files-found: error
