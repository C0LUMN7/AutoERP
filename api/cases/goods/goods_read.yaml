- baseInfo:
    api_name: 商品查询
    url: /material/list
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 正常查询商品列表（只读冒烟，不提取历史数据行ID用于后续写操作）
      validation:
        - contains: { 'status_code': 200, 'code': 200 }
